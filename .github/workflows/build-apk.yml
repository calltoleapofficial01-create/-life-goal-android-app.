name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/life-goal-investment.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-goal-investment-android-apk
          path: app/build/outputs/apk/debug/life-goal-investment.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: main
          name: Latest Life Goal Investment Android APK
          body: |
            Direct APK download for the Life Goal Investment Android app.
            This app opens the existing Life Goal Investment website and requires an internet connection.
            This is a debug-signed APK for direct installation, not a Play Store release.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/life-goal-investment.apk
          overwrite_files: true
